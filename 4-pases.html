<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pase para 4 personas | María Valeria</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    font-family: Georgia, "Times New Roman", serif;
    background:
      radial-gradient(circle at 20% 10%, rgba(212,175,55,.12), transparent 28%),
      radial-gradient(circle at 80% 90%, rgba(212,175,55,.10), transparent 26%),
      #fbf3e4;
    color: #9a6f2f;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: min(92vw, 430px);
    background: rgba(255,250,241,.92);
    border: 1px solid rgba(176,141,87,.45);
    border-radius: 24px;
    padding: 42px 28px;
    text-align: center;
    box-shadow: 0 18px 45px rgba(112,78,30,.12);
    position: relative;
    overflow: hidden;
  }
  .card:before, .card:after {
    content: "✦";
    position: absolute;
    color: rgba(176,141,87,.34);
    font-size: 22px;
  }
  .card:before { top: 18px; left: 22px; }
  .card:after { bottom: 18px; right: 22px; }
  .kicker {
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  h1 {
    margin: 0;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(30px, 8vw, 42px);
    line-height: 1.12;
    color: #b08d57;
  }
  .line {
    width: 86px;
    height: 1px;
    background: #b08d57;
    margin: 22px auto;
  }
  .note {
    margin: 0 auto 28px;
    max-width: 310px;
    font-size: 14px;
    line-height: 1.6;
    color: #7f6b4b;
    font-style: italic;
  }
  .button {
    display: inline-block;
    text-decoration: none;
    color: #fffaf1;
    background: linear-gradient(135deg, #b9924d, #8f6a2e);
    padding: 15px 28px;
    border-radius: 999px;
    letter-spacing: 2px;
    font-size: 13px;
    text-transform: uppercase;
    box-shadow: 0 8px 18px rgba(143,106,46,.22);
  }
  .button:active { transform: translateY(1px); }
  .small {
    margin-top: 16px;
    font-size: 11px;
    color: #a18b68;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="kicker">Invitación personal</div>
    <h1>Pase para 4 personas</h1>
    <div class="line"></div>
    <p class="note">Agradecemos respetar el número de pases asignados.</p>
    <a class="button" href="https://www.misxvmariavaleria.com/">Abrir invitación</a>
    <div class="small">XV años de María Valeria</div>
  </main>
</body>
</html>
